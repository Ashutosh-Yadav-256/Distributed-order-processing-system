version: '3.8'

services:
  # -------------------------------------------------------------
  # Infrastructure Data Stores & Messaging
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  # -------------------------------------------------------------
  # Observability
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: platform-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - platform-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: platform-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - platform-network

  # -------------------------------------------------------------
  # Core Platform Microservices
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: platform-api-gateway
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 8081
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 8082
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 8083
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 8084
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - platform-network

  order-service:
    build:
      context: ../../services/order-service
      dockerfile: Dockerfile
    container_name: platform-order-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network

  inventory-service:
    build:
      context: ../../services/inventory-service
      dockerfile: Dockerfile
    container_name: platform-inventory-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network

  payment-service:
    build:
      context: ../../services/payment-service
      dockerfile: Dockerfile
    container_name: platform-payment-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network

  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: platform-notification-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network

  # -------------------------------------------------------------
  # Floci: Lightweight Open-Source Local AWS Cloud Emulator
  # (Emulates S3, SQS, SNS, Secrets Manager on Port 4566 in ~24ms)
  # -------------------------------------------------------------
  floci-aws:
    image: floci/floci:latest
    container_name: platform-floci-aws
    ports:
      - "4566:4566"
    volumes:
      - floci_data:/app/data
    environment:
      - SERVICES=s3,sqs,sns,secretsmanager
    networks:
      - platform-network

volumes:
  postgres_data:
  floci_data:

networks:
  platform-network:
    driver: bridge

